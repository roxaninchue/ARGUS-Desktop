name: pr-shots
# UI screenshots for pull requests (never builds or releases). Pushed to the shots-pr branch.
on:
  pull_request:
    paths: ['frontend/**', 'ci/**']
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Unit test the plain-words step describer
        run: node ci/steps.test.js
      - name: Test the composer pickers in jsdom (/skills narrows as you type)
        run: |
          mkdir -p /tmp/jd && npm i -s --prefix /tmp/jd jsdom@30.1.2
          NODE_PATH=/tmp/jd/node_modules node ci/picker.test.js
      - name: Test the Specialists strip in jsdom (a finished round tucks away)
        run: NODE_PATH=/tmp/jd/node_modules node ci/specs.test.js
      - name: No square UI (every stylesheet rounded, like Android's NoSquareTest)
        run: node ci/nosquare.test.js
      - name: Test the mobile design in jsdom (bubbles, composer, rich replies)
        run: NODE_PATH=/tmp/jd/node_modules node ci/design.test.js
      - name: Screenshot the UI
        run: |
          pip install -q playwright && python -m playwright install --with-deps chromium
          python ci/shots.py
      - name: Push screenshots to the shots-pr branch
        if: always()
        run: |
          cd shots
          git init -q && git checkout -q -b shots-pr
          git -c user.name=ci -c user.email=ci@blaze add -A
          git -c user.name=ci -c user.email=ci@blaze commit -qm "PR UI shots ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" shots-pr
