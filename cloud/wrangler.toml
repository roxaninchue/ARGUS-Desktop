# Blaze accounts + one-click connector broker. Free tier only: Workers + one KV namespace.
name = "blaze-auth"
main = "src/index.ts"
compatibility_date = "2025-10-01"
account_id = "ef895b6795ee39066c863c39a42ec8b6"
workers_dev = true

[vars]
BASE_URL = "https://blaze-auth.blaze-app.workers.dev"
# Comma-separated browser origins allowed to call the API (the desktop app calls from Go and
# sends no Origin). The website signs in from these; web sign-in and reset links only return here.
ALLOWED_ORIGINS = "https://blazeinchue.pages.dev"
# WebCrypto in Workers caps PBKDF2 at 100000 iterations. Lower it (e.g. 60000) only if
# free-tier sign-ins hit "exceeded CPU time"; each user's hash keeps its own count.
PBKDF2_ITERATIONS = "100000"

# 0.9.4: Workers Rate Limiting (free plan; period must be 10 or 60 seconds). See src/ratelimit.ts.
[[ratelimits]]
name = "RL_IP"          # per IP per endpoint group
namespace_id = "9401"
simple = { limit = 60, period = 60 }  # generous: mobile carriers put many users behind one IP (CGNAT)

[[ratelimits]]
name = "RL_ACCT"        # per target account / token per endpoint group
namespace_id = "9402"
simple = { limit = 6, period = 60 }

[[ratelimits]]
name = "RL_POLL"        # device-code polling per IP
namespace_id = "9403"
simple = { limit = 120, period = 60 }  # 0.9.7: CLI polls every 1 s (or long-polls 20 s)

[[kv_namespaces]]
binding = "KV"
id = "03a2047f64234d28946816100f97e46a"

# blaze-gateway (0.6.3+): password-reset mail goes out through its POST /internal/mail (Brevo).
# Workers on one account can't fetch each other's *.workers.dev URL, so this is a service binding.
# (blaze-gateway binds back to blaze-auth as AUTH; Cloudflare allows the two-way binding.)
[[services]]
binding = "GATEWAY"
service = "blaze-gateway"

# Secrets (never in this file): wrangler secret put <NAME>
#   GOOGLE_CLIENT_ID   GOOGLE_CLIENT_SECRET    sign-in with Google + Google connector
#   GITHUB_CLIENT_ID   GITHUB_CLIENT_SECRET    sign-in with GitHub + GitHub connector
#   SPOTIFY_CLIENT_ID  SPOTIFY_CLIENT_SECRET
#   NOTION_CLIENT_ID   NOTION_CLIENT_SECRET
#   SLACK_CLIENT_ID    SLACK_CLIENT_SECRET
#   INTERNAL_TOKEN     32+ random characters, the SAME value as blaze-gateway INTERNAL_TOKEN (0.6.3+):
#                      sent as X-Internal-Token to https://gateway/internal/mail. Without it (or without the
#                      GATEWAY binding) /v1/providers says password_reset:false and /forgot answers 503.
# A provider without both secrets answers 503 {"error":"not_configured"}.

# 0.9.4: no request logging (bodies carry passwords/tokens); console.error prints error names only.
[observability]
enabled = false

# 0.9.7: device-code state (strongly consistent; KV edge caching made approve->signed-in take ~1 min)
[[durable_objects.bindings]]
name = "DEVICE"
class_name = "DeviceDO"

[[migrations]]
tag = "v1-device"
new_sqlite_classes = ["DeviceDO"]
